<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>PitMind AI</title>
<style>
  :root{--bg:#0b0e14;--panel:#141a26;--panel2:#1c2436;--line:#26304a;--txt:#e6e9f0;--mut:#8a95ad;--acc:#f5b942}
  *{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--txt);font:15px/1.6 system-ui,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:820px;margin:0 auto;padding:24px}
  h1{font-size:24px}h1 b{color:var(--acc)}.sub{color:var(--mut);font-size:13px;margin:4px 0 20px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .chip{cursor:pointer;font-size:13px;color:#cdd4df;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
  .chip:hover{border-color:var(--acc)}
  .ask{display:flex;gap:10px}.ask input{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:12px 14px;font-size:15px}
  .ask button{background:var(--acc);color:#111;border:0;border-radius:10px;padding:0 20px;font-weight:700;cursor:pointer}
  .ans{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:0 12px 12px 0;padding:16px}
  .ans .txt{font-size:15px}.grounded-no{border-left-color:#f4a}
  .src{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
  .src span{font-size:12px;color:var(--mut);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 10px}
  .meta{color:var(--mut);font-size:12px;margin-top:20px}
  .err{background:#2a1520;border:1px solid #6a2a3a;color:#f4a;padding:12px;border-radius:10px;font-size:14px;margin-top:12px}
  code{background:var(--panel2);padding:2px 6px;border-radius:4px}
</style></head><body><div class="wrap">
  <h1><b>PitMind</b> AI</h1>
  <div class="sub">Grounded race-engineering assistant · <span id="mode">-</span></div>
  <div class="chips" id="chips"></div>
  <div class="ask"><input id="q" placeholder="Ask a race-engineering question..." autocomplete="off"/>
    <button id="go">Ask</button></div>
  <div id="out"></div>
  <div class="meta" id="meta"></div>
<script>
const API = location.protocol==="file:" ? "http://localhost:8000" : "";
const g = id => document.getElementById(id);
const qs = ["What is an undercut?","How do tyres degrade?","Explain stint analysis","When should I pit under a safety car?"];
g("chips").innerHTML = qs.map(q=>`<span class="chip">${q}</span>`).join("");
async function ask(q){
  if(!q) return;
  g("out").innerHTML = `<div class="ans"><div class="txt" style="color:#8a95ad">Thinking...</div></div>`;
  try {
    const r = await fetch(API+"/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q})});
    const a = await r.json();
    const src = (a.sources||[]).map(s=>`<span>${s.title} · ${s.score}</span>`).join("");
    g("out").innerHTML = `<div class="ans ${a.grounded?'':'grounded-no'}">
      <div class="txt">${a.answer}</div>${src?`<div class="src">${src}</div>`:""}</div>`;
  } catch(e){
    g("out").innerHTML = `<div class="err">Can't reach the API. Start it first:<br>
      <code>cd backend &amp;&amp; python -m uvicorn app.main:app --reload</code><br>then reload. (${e.message})</div>`;
  }
}
g("go").onclick = ()=>ask(g("q").value);
g("q").addEventListener("keydown",e=>{if(e.key==="Enter")ask(e.target.value);});
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{g("q").value=c.textContent;ask(c.textContent);});
(async()=>{ try{
  const h = await (await fetch(API+"/health")).json();
  const m = await (await fetch(API+"/evaluate")).json();
  g("mode").textContent = (h.llm?"LLM narration on":"deterministic grounded mode")+` · ${h.documents} docs`;
  g("meta").innerHTML = `Retrieval eval: precision@1 ${m.precision_at_1}, recall@${m.k} ${m.recall_at_k}, MRR ${m.mrr}`;
}catch(e){} })();
</script></div></body></html>
